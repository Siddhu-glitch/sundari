<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>since it got you</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui, sans-serif;
  color:#fff;
  background:#000;
  overflow:hidden;
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:opacity 1.8s ease;
  z-index:-1;
}
.bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.35);
}

/* LOCK */
.lock{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}
.lock-box{text-align:center;}
.lock-box input{
  padding:12px 16px;
  border-radius:14px;
  border:none;
  font-size:1rem;
}
.lock-box button{
  margin-top:14px;
  padding:10px 24px;
  border:none;
  border-radius:16px;
  background:#fff;
  cursor:pointer;
}

/* LAYOUT */
.wrapper{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.frame{
  width:100%;
  height:100%;
  max-width:160vh;
  aspect-ratio:16/9;
  display:grid;
  grid-template-columns:1.2fr 1.6fr 1fr;
  padding:50px;
}

/* LEFT */
.left{display:flex;align-items:center;}
.left p{line-height:2;}

/* CENTER */
.center{text-align:center;padding-top:20px;}
.center h1{font-size:2rem;line-height:1.6;}

/* RIGHT */
.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;
  gap:14px;
}
.time{text-align:right;}
.time .num{font-size:1.4rem;}
.time .label{font-size:0.7rem;opacity:0.8;}

.name{
  margin-top:100px;
  font-size:1.1rem;
  opacity:0.85;
}

/* MOON BOX */
.moon{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  font-size:0.95rem;
  line-height:1.7;
  border:1px solid rgba(255,255,255,0.4);
  padding:16px 26px;
  border-radius:18px;
  background:rgba(0,0,0,0.25);
  max-width:520px;
  transition:opacity 0.6s ease;
}

/* NEXT */
.next{
  position:absolute;
  bottom:18px;
  right:20px;
  font-size:0.9rem;
  cursor:pointer;
  opacity:0.7;
}

.hidden{display:none;}

/* MOBILE FIX (IMPORTANT) */
@media (max-width:768px){

  body{overflow:hidden;}

  .wrapper{
    align-items:flex-start;
    overflow-y:auto;
  }

  .frame{
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto;
    aspect-ratio:auto;
    padding:24px;
    padding-bottom:140px;
  }

  .left{text-align:left;justify-content:center;}
  .left p{font-size:0.95rem;line-height:1.8;}

  .center h1{
    font-size:1.4rem;
    margin-bottom:18px;
  }

  .right{
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:12px 18px;
  }

  .time{text-align:center;}
  .time .num{font-size:1.1rem;}
  .time .label{font-size:0.65rem;}

  .name{
    width:100%;
    text-align:center;
    margin-top:16px;
  }

  /* KEY FIX */
  .moon{
    position:relative;
    bottom:auto;
    left:auto;
    transform:none;
    margin:28px auto 10px;
    max-width:90%;
    font-size:0.85rem;
  }

  .next{
    position:fixed;
    bottom:20px;
    right:16px;
  }
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<!-- LOCK -->
<div class="lock" id="lock">
  <div class="lock-box">
    <input type="password" id="pw" placeholder="password">
    <br>
    <button onclick="unlock()">open</button>
  </div>
</div>

<!-- CONTENT -->
<div class="wrapper hidden" id="content">
  <div class="frame">

    <div class="left">
      <p>
        some people walk in<br>
        and the air feels lighter<br><br>
        smiles stay a little longer<br>
        days move a little softer<br><br>
        you do that<br>
        just by being you
      </p>
    </div>

    <div class="center">
      <h1>
        This world has been quietly celebrating<br>
        since it got you &lt;3
      </h1>
    </div>

    <div class="right">
      <div class="time"><div class="num" id="years"></div><div class="label">years</div></div>
      <div class="time"><div class="num" id="months"></div><div class="label">months</div></div>
      <div class="time"><div class="num" id="weeks"></div><div class="label">weeks</div></div>
      <div class="time"><div class="num" id="days"></div><div class="label">days</div></div>
      <div class="time"><div class="num" id="hours"></div><div class="label">hours</div></div>
      <div class="time"><div class="num" id="seconds"></div><div class="label">seconds</div></div>
      <div class="name" id="nameBox"></div>
    </div>

  </div>
</div>

<div class="moon" id="moonBox"></div>
<div class="next" onclick="nextImage()">>></div>

<script>
/* CONFIG */
const PASSWORD = btoa("Anjali<3");
const birth = new Date("2003-01-06T00:00:00");

/* BACKGROUND */
const images=[
 "1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg",
 "9.jpg","10.jpg","11.jpg","12.jpg","13.jpg","14.jpg","15.jpg",
 "16.jpg","17.jpg"
];
let bgIndex=0;
const bg=document.getElementById("bg");

function showBg(){
  bg.style.opacity=0;
  setTimeout(()=>{
    bg.style.backgroundImage=`url('${images[bgIndex]}')`;
    bg.style.opacity=1;
    bgIndex=(bgIndex+1)%images.length;
  },500);
}

/* NAME AUTO CHANGE */
const names=[
 "Princess 👑💖","Queen 👸✨","Sunshine ☀️🤍","Moon 🌙✨",
 "Cutie 🥺💗","Happy Place 🌈🤍","Softest Soul 🤍✨","Baddie 😎🔥"
];
let ni=0;
const nameBox=document.getElementById("nameBox");
nameBox.innerText=names[0];
setInterval(()=>{
  ni=(ni+1)%names.length;
  nameBox.innerText=names[ni];
},2500);

/* TIME */
setInterval(()=>{
  const diff=new Date()-birth;
  const sec=Math.floor(diff/1000);
  const hr=Math.floor(sec/3600);
  const day=Math.floor(hr/24);
  seconds.innerText=sec;
  hours.innerText=hr;
  days.innerText=day;
  weeks.innerText=Math.floor(day/7);
  months.innerText=Math.floor(day/30.44);
  years.innerText=Math.floor(day/365.25);
},1000);

/* MOON TEXT */
const moonLines=[
 "Since you were born, the world counted moons and sunsets — unaware that something softer was quietly becoming unforgettable.",
 "People saw sunsets. The people around you saw full moons whenever you smiled.",
 "The moon rises on schedule. Your warmth always arrived unexpectedly.",
 "Sunsets happen daily. Moments with you never felt ordinary."
];
let mi=0;
const moonBox=document.getElementById("moonBox");

function updateMoon(){
  moonBox.style.opacity=0;
  setTimeout(()=>{
    moonBox.innerText=moonLines[mi];
    moonBox.style.opacity=1;
    mi=(mi+1)%moonLines.length;
  },600);
}
updateMoon();
setInterval(updateMoon,18000);

/* LOCK */
function unlock(){
  if(btoa(pw.value)===PASSWORD){
    lock.classList.add("hidden");
    content.classList.remove("hidden");
    showBg();
    setInterval(showBg,28000);
  }
}
</script>

</body>
</html>
