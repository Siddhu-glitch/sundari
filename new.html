<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>music for you</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:"Century Gothic","Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fde2e4,#fff1f2,#fef3c7);
  color:#374151;
}

/* ===== LAYOUT ===== */
.container{
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR (TRANSPARENT) ===== */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100vh;
  padding:24px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  z-index:1000;
  transition:left .45s cubic-bezier(.25,1.4,.5,1);
}
.sidebar.open{left:0}

.playlist-btn{
  cursor:pointer;
  margin-bottom:14px;
  opacity:.85;
}
.playlist-btn:hover{opacity:1}
.playlist-btn.active{
  background:linear-gradient(90deg,rgba(236,72,153,.35),transparent);
  border-radius:10px;
  padding:8px 10px;
  font-weight:600;
}

/* ===== TOGGLE ===== */
.sidebar-toggle{
  position:fixed;
  top:50%;
  left:0;
  transform:translateY(-50%);
  background:rgba(255,255,255,.7);
  padding:10px 6px;
  border-radius:0 10px 10px 0;
  font-weight:600;
  cursor:pointer;
  z-index:1001;
}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.2);
  backdrop-filter:blur(4px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:999;
}
.overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:28px;
  width:100%;
  overflow:hidden;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  gap:20px;
  align-items:center;
}
.header img{
  width:150px;
  height:150px;
  border-radius:14px;
  object-fit:cover;
}
.header h1{
  margin:0;
  font-size:2.4rem;
}
.poetry{opacity:.6;font-style:italic}

/* ===== SONG LIST ===== */
.song-header,.song{
  display:grid;
  grid-template-columns:40px 60px 2fr 1.5fr 60px;
  padding:10px;
  align-items:center;
}
.song-header{
  margin-top:20px;
  opacity:.5;
  border-bottom:1px solid rgba(0,0,0,.1);
}
.song{
  border-radius:10px;
  cursor:pointer;
}
.song:hover{background:rgba(255,255,255,.35)}
.song img{
  width:42px;
  height:42px;
  border-radius:6px;
}
.song.playing{
  background:linear-gradient(90deg,rgba(236,72,153,.25),transparent);
  font-weight:600;
}

/* ===== SCROLL ===== */
#songs{
  height:calc(100vh - 360px);
  overflow-y:auto;
  padding-bottom:180px;
}
#songs::-webkit-scrollbar{width:0}
#songs{scrollbar-width:none}

/* ===================================================== */
/* =================== NEW PLAYER ====================== */
/* ===================================================== */

.player{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:720px;
  background:rgba(255,255,255,.95);
  border-radius:22px;
  padding:14px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.15);
}

/* TOP */
.player-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.player-top img{
  width:56px;
  height:56px;
  border-radius:12px;
  object-fit:cover;
}

.song-info{
  flex:1;
  min-width:0;
}
.song-info h4{
  margin:0;
  font-size:1.05rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-info p{
  margin:2px 0 0;
  font-size:.85rem;
  opacity:.6;
}

/* CONTROLS CENTER */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:32px;
  margin:10px 0 6px;
}
.controls button{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
}
.controls .play{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#ec4899;
  color:#fff;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(236,72,153,.45);
}

/* PROGRESS + TIME */
.progress-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:.75rem;
  opacity:.65;
}
.progress{
  flex:1;
  height:4px;
  background:rgba(0,0,0,.15);
  border-radius:10px;
  cursor:pointer;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#ec4899;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="sidebar-toggle" onclick="toggleSidebar()">》》》</div>
<div class="overlay" onclick="closeSidebar()"></div>

<div class="container">

  <div class="sidebar">
    <h3>playlists</h3>
    <div class="playlist-btn" data-key="morning" onclick="load('morning');closeSidebar()">🌅 morning feels</div>
    <div class="playlist-btn" data-key="goto" onclick="load('goto');closeSidebar()">🎧 my go to songs</div>
    <div class="playlist-btn" data-key="cry" onclick="load('cry');closeSidebar()">🖤 Cry with me</div>
    <div class="playlist-btn" data-key="emo" onclick="load('emo');closeSidebar()">🌧️ endhukoo emo</div>
  </div>

  <div class="main">
    <div class="header">
      <img id="cover" src="mrng.jpeg">
      <div>
        <p style="opacity:.6">Public Playlist</p>
        <h1 id="title">morning feels 🥰</h1>
        <div class="poetry" id="poetry">I wake up softer than yesterday</div>
      </div>
    </div>

    <div class="song-header">
      <span>#</span><span></span><span>Title</span><span>Album</span><span>⏱</span>
    </div>

    <div id="songs"></div>
  </div>
</div>

<!-- PLAYER -->
<div class="player">
  <div class="player-top">
    <img id="pimg">
    <div class="song-info">
      <h4 id="ptitle">—</h4>
      <p id="partist">—</p>
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
  </div>

  <div class="progress-wrap">
    <span id="cur">0:00</span>
    <div class="progress" onclick="seek(event)">
      <div class="progress-bar" id="bar"></div>
    </div>
    <span id="dur">0:00</span>
  </div>

  <audio id="audio"></audio>
</div>

<script>
function toggleSidebar(){
  document.querySelector(".sidebar").classList.toggle("open");
  document.querySelector(".overlay").classList.toggle("show");
}
function closeSidebar(){
  document.querySelector(".sidebar").classList.remove("open");
  document.querySelector(".overlay").classList.remove("show");
}

const playlists={
  morning:{
    title:"morning feels 🥰",
    poetry:"I wake up softer than yesterday",
    cover:"mrng.jpeg",
    songs:[
      {title:"Mera Mann Kehne Laga",artist:"Falak Shabbir",album:"Nautanki Saala",time:"3:47",img:"1.jpeg",src:"songs/Mera Mann Kehne Laga Nautanki Saala! 320 Kbps.mp3"},
      {title:"Tum Se Hi",artist:"Mohit Chauhan",album:"Jab We Met",time:"5:21",img:"2.jpeg",src:"songs/Tum Se Hi Jab We Met 320 Kbps.mp3"}
    ]
  }
};

let list=[],index=0;
const audio=document.getElementById("audio");

function load(key){
  const p=playlists[key];
  title.textContent=p.title;
  poetry.textContent=p.poetry;
  cover.src=p.cover;
  list=p.songs;
  songs.innerHTML="";
  p.songs.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="song";
    d.innerHTML=`<span>${i+1}</span><img src="${s.img}"><span>${s.title}</span><span>${s.album}</span><span>${s.time}</span>`;
    d.onclick=()=>play(i);
    songs.appendChild(d);
  });
  if(list.length) play(0);
}

function play(i){
  index=i;
  const s=list[i];
  audio.src=s.src;
  audio.play();
  pimg.src=s.img;
  ptitle.textContent=s.title;
  partist.textContent=s.artist;
}
function toggle(){
  if(audio.paused){
    audio.play();
    playBtn.textContent="❚❚";
  }else{
    audio.pause();
    playBtn.textContent="▶";
  }
}
function prev(){play((index-1+list.length)%list.length)}
function next(){play((index+1)%list.length)}

audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration)*100+"%";
  cur.textContent=format(audio.currentTime);
  dur.textContent=format(audio.duration);
};
function seek(e){
  audio.currentTime=(e.offsetX/e.target.offsetWidth)*audio.duration;
}
function format(t){
  if(!t) return "0:00";
  const m=Math.floor(t/60);
  const s=Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

load("morning");
</script>

</body>
</html>
