<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>music for you</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:"Century Gothic","Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fde2e4,#fff1f2,#fef3c7);
  color:#374151;
}

/* ===== MAIN ===== */
.main{
  padding:24px;
  padding-bottom:160px;
}

/* ===== PLAYER (SPOTIFY STYLE) ===== */
.player{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:680px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}

/* TOP INFO */
.player-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.player-top img{
  width:52px;
  height:52px;
  border-radius:10px;
  object-fit:cover;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-info h4{
  margin:0;
  font-size:1.05rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-info p{
  margin:2px 0 0;
  font-size:.85rem;
  opacity:.6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* LIKE */
.like-btn{
  font-size:22px;
  cursor:pointer;
  opacity:.5;
  transition:.2s;
}
.like-btn.loved{
  color:#ec4899;
  opacity:1;
  transform:scale(1.1);
}

/* PROGRESS */
.progress-wrap{
  margin:14px 0 8px;
}
.progress{
  width:100%;
  height:4px;
  background:rgba(0,0,0,.15);
  border-radius:10px;
  cursor:pointer;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#ec4899;
  border-radius:10px;
}
.time{
  display:flex;
  justify-content:space-between;
  font-size:.75rem;
  opacity:.6;
  margin-top:4px;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:34px;
  margin-top:6px;
}

.controls button{
  background:none;
  border:none;
  cursor:pointer;
}

.controls .play{
  width:64px;
  height:64px;
  border-radius:50%;
  background:#ec4899;
  color:#fff;
  font-size:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(236,72,153,.45);
}

.controls .small{
  font-size:22px;
  opacity:.85;
}

/* MOBILE */
@media(max-width:480px){
  .controls{gap:26px}
  .controls .play{
    width:58px;
    height:58px;
  }
}
</style>
</head>

<body>

<div class="main">
  <h2>morning feels 🥰</h2>
  <p style="opacity:.6">I wake up softer than yesterday</p>
</div>

<!-- PLAYER -->
<div class="player">

  <div class="player-top">
    <img id="pimg" src="1.jpeg">
    <div class="song-info">
      <h4 id="ptitle">Mera Mann Kehne Laga</h4>
      <p id="partist">Falak Shabbir</p>
    </div>
    <div id="likeBtn" class="like-btn">♥</div>
  </div>

  <div class="progress-wrap">
    <div class="progress" onclick="seek(event)">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="time">
      <span id="cur">0:00</span>
      <span id="dur">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="small" onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button class="small" onclick="next()">⏭</button>
  </div>

  <audio id="audio"></audio>
</div>

<script>
const playlist=[
  {
    title:"Mera Mann Kehne Laga",
    artist:"Falak Shabbir",
    img:"1.jpeg",
    src:"songs/Mera Mann Kehne Laga Nautanki Saala! 320 Kbps.mp3"
  },
  {
    title:"Tum Se Hi",
    artist:"Mohit Chauhan",
    img:"2.jpeg",
    src:"songs/Tum Se Hi Jab We Met 320 Kbps.mp3"
  }
];

let index=0;
const audio=document.getElementById("audio");
const loved=JSON.parse(localStorage.getItem("lovedSongs")||"[]");

function load(i){
  index=i;
  const s=playlist[i];
  audio.src=s.src;
  pimg.src=s.img;
  ptitle.textContent=s.title;
  partist.textContent=s.artist;
  dur.textContent="0:00";
  likeBtn.classList.toggle("loved",loved.includes(s.src));
}

function toggle(){
  if(audio.paused){
    audio.play();
    playBtn.textContent="❚❚";
  }else{
    audio.pause();
    playBtn.textContent="▶";
  }
}

function prev(){
  load((index-1+playlist.length)%playlist.length);
  audio.play();
}
function next(){
  load((index+1)%playlist.length);
  audio.play();
}

audio.onloadedmetadata=()=>dur.textContent=format(audio.duration);
audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration)*100+"%";
  cur.textContent=format(audio.currentTime);
};
audio.onended=next;

function seek(e){
  audio.currentTime=(e.offsetX/e.target.offsetWidth)*audio.duration;
}

function format(t){
  if(!t)return"0:00";
  const m=Math.floor(t/60);
  const s=Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

/* LOVE */
likeBtn.onclick=()=>{
  const src=playlist[index].src;
  if(loved.includes(src)){
    loved.splice(loved.indexOf(src),1);
  }else{
    loved.push(src);
  }
  localStorage.setItem("lovedSongs",JSON.stringify(loved));
  likeBtn.classList.toggle("loved");
};

load(0);
</script>

</body>
</html>
