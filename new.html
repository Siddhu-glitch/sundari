<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>music for you</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:"Century Gothic","Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fde2e4,#fff1f2,#fef3c7);
  color:#374151;
}

/* ================= DESKTOP LAYOUT ================= */
.container{
  display:flex;
  height:100vh;
}

/* ================= SIDEBAR ================= */
.sidebar{
  width:260px;
  padding:24px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  flex-shrink:0;
}

.sidebar h3{
  margin-top:0;
  opacity:.6;
}

.playlist-btn{
  margin:14px 0;
  cursor:pointer;
  opacity:.85;
}
.playlist-btn:hover{opacity:1}
.playlist-btn.active{
  padding:8px 10px;
  border-radius:10px;
  background:linear-gradient(90deg,rgba(236,72,153,.35),transparent);
  font-weight:600;
}

/* ================= MAIN ================= */
.main{
  flex:1;
  padding:28px;
  overflow:hidden;
}

/* HEADER */
.header{
  display:flex;
  gap:26px;
  align-items:center;
  margin-bottom:28px;
}
.header img{
  width:170px;
  height:170px;
  border-radius:18px;
  object-fit:cover;
}
.meta p{
  margin:0;
  font-size:.9rem;
  opacity:.5;
}
.meta h1{
  margin:4px 0;
  font-size:2.1rem;
}
.poetry{
  font-style:italic;
  opacity:.6;
}

/* SONG LIST */
.song-header,.song{
  display:grid;
  grid-template-columns:40px 60px 2fr 1.5fr 60px;
  padding:10px;
  align-items:center;
}
.song-header{
  opacity:.5;
  border-bottom:1px solid rgba(0,0,0,.1);
}
.song{
  border-radius:10px;
  cursor:pointer;
}
.song:hover{background:rgba(255,255,255,.35)}
.song img{
  width:42px;
  height:42px;
  border-radius:6px;
}
.song.playing{
  background:linear-gradient(90deg,rgba(236,72,153,.25),transparent);
  font-weight:600;
}

/* SCROLL ONLY SONGS */
#songs{
  height:calc(100vh - 360px);
  overflow-y:auto;
  padding-bottom:140px;
}
#songs::-webkit-scrollbar{width:0}
#songs{scrollbar-width:none}

/* ================= PLAYER ================= */
.player{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:720px;
  background:rgba(255,255,255,.95);
  border-radius:14px;
  padding:8px 14px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.player-top{
  display:flex;
  gap:12px;
  align-items:center;
}
.player-top img{
  width:44px;
  height:44px;
  border-radius:10px;
}
.song-info h4{
  margin:0;
  font-size:.95rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-info p{
  margin:1px 0 0;
  font-size:.75rem;
  opacity:.6;
}

.controls{
  display:flex;
  justify-content:center;
  gap:22px;
  margin:6px 0 4px;
}
.controls button{
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
}
.play{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#ec4899;
  color:#fff;
  font-size:20px;
}

.progress-wrap{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:.7rem;
  opacity:.6;
}
.progress{
  flex:1;
  height:3px;
  background:rgba(0,0,0,.15);
  border-radius:10px;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#ec4899;
  border-radius:10px;
}

/* ================= MOBILE ================= */
.sidebar-toggle{
  display:none;
}
.overlay{
  display:none;
}

@media(max-width:768px){
  .container{display:block}

  .sidebar{
    position:fixed;
    left:-260px;
    top:0;
    height:100vh;
    transition:.3s;
    z-index:1000;
  }
  .sidebar.open{left:0}

  .sidebar-toggle{
    display:block;
    position:fixed;
    left:0;
    top:50%;
    transform:translateY(-50%);
    padding:10px 6px;
    background:rgba(255,255,255,.7);
    border-radius:0 10px 10px 0;
    z-index:1001;
    cursor:pointer;
  }

  .overlay{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:.3s;
  }
  .overlay.show{
    opacity:1;
    pointer-events:auto;
  }
}
</style>
</head>

<body>

<div class="sidebar-toggle" onclick="toggleSidebar()">》》》</div>
<div class="overlay" onclick="closeSidebar()"></div>

<div class="container">

  <div class="sidebar">
    <h3>playlists</h3>
    <div class="playlist-btn" data-key="morning" onclick="load('morning')">🌅 morning feels</div>
    <div class="playlist-btn" data-key="goto" onclick="load('goto')">🎧 my go to songs</div>
    <div class="playlist-btn" data-key="cry" onclick="load('cry')">🖤 Cry with me</div>
    <div class="playlist-btn" data-key="emo" onclick="load('emo')">🌧️ endhukoo emo</div>
    <div class="playlist-btn" data-key="voice" onclick="load('voice')">🎙️ Voice</div>
  </div>

  <div class="main">
    <div class="header">
      <img id="cover">
      <div class="meta">
        <p>Public Playlist</p>
        <h1 id="title"></h1>
        <div class="poetry" id="poetry"></div>
      </div>
    </div>

    <div class="song-header">
      <span>#</span><span></span><span>Title</span><span>Album</span><span>⏱</span>
    </div>

    <div id="songs"></div>
  </div>

</div>

<div class="player">
  <div class="player-top">
    <img id="pimg">
    <div class="song-info">
      <h4 id="ptitle">—</h4>
      <p id="partist">—</p>
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
  </div>

  <div class="progress-wrap">
    <span id="cur">0:00</span>
    <div class="progress" onclick="seek(event)">
      <div class="progress-bar" id="bar"></div>
    </div>
    <span id="dur">0:00</span>
  </div>

  <audio id="audio"></audio>
</div>

<script>
const playlists={
  morning:{
    title:"morning feels 🥰",
    poetry:"I wake up softer than yesterday",
    cover:"mrng.jpeg",
    songs:[
      {title:"Mera Mann Kehne Laga",artist:"Falak Shabbir",album:"Nautanki Saala",time:"3:47",img:"1.jpeg",src:"songs/Mera Mann Kehne Laga Nautanki Saala! 320 Kbps.mp3"},
      {title:"Tum Se Hi",artist:"Mohit Chauhan",album:"Jab We Met",time:"5:21",img:"2.jpeg",src:"songs/Tum Se Hi Jab We Met 320 Kbps.mp3"}
    ]
  },
  goto:{title:"my go to songs",poetry:"these sound like me",cover:"mrng.jpeg",songs:[]},
  cry:{title:"Cry with me",poetry:"I let myself feel it",cover:"mrng.jpeg",songs:[]},
  emo:{title:"endhukoo emo",poetry:"some things don’t need answers",cover:"mrng.jpeg",songs:[]},
  voice:{title:"Voice",poetry:"just listen",cover:"mrng.jpeg",songs:[]}
};

let list=[],index=0;
const audio=document.getElementById("audio");

function toggleSidebar(){
  if(window.innerWidth>768) return;
  document.querySelector(".sidebar").classList.toggle("open");
  document.querySelector(".overlay").classList.toggle("show");
}
function closeSidebar(){
  if(window.innerWidth>768) return;
  document.querySelector(".sidebar").classList.remove("open");
  document.querySelector(".overlay").classList.remove("show");
}

function load(key){
  closeSidebar();
  document.querySelectorAll(".playlist-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.key===key);
  });
  const p=playlists[key];
  cover.src=p.cover;
  title.textContent=p.title;
  poetry.textContent=p.poetry;
  list=p.songs;
  songs.innerHTML="";
  list.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="song";
    d.innerHTML=`<span>${i+1}</span><img src="${s.img}"><span>${s.title}</span><span>${s.album}</span><span>${s.time}</span>`;
    d.onclick=()=>play(i);
    songs.appendChild(d);
  });
  if(list.length) play(0);
}

function play(i){
  index=i;
  const s=list[i];
  audio.src=s.src;
  audio.play();
  pimg.src=s.img;
  ptitle.textContent=s.title;
  partist.textContent=s.artist;
}
function toggle(){
  if(audio.paused){audio.play();playBtn.textContent="❚❚"}
  else{audio.pause();playBtn.textContent="▶"}
}
function prev(){play((index-1+list.length)%list.length)}
function next(){play((index+1)%list.length)}

audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration)*100+"%";
  cur.textContent=format(audio.currentTime);
  dur.textContent=format(audio.duration);
};
function seek(e){
  audio.currentTime=(e.offsetX/e.target.offsetWidth)*audio.duration;
}
function format(t){
  if(!t) return "0:00";
  const m=Math.floor(t/60);
  const s=Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

load("morning");
</script>

</body>
</html>
