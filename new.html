<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>music for you</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:"Century Gothic","Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fde2e4,#fff1f2,#fef3c7);
  color:#374151;
}

/* ===== LAYOUT ===== */
.container{
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100vh;
  padding:24px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  z-index:1000;
  transition:left .45s cubic-bezier(.25,1.4,.5,1);
}
.sidebar.open{left:0}

.playlist-btn{
  cursor:pointer;
  margin-bottom:14px;
  opacity:.85;
}
.playlist-btn:hover{opacity:1}

.playlist-btn.active{
  background:linear-gradient(90deg,rgba(236,72,153,.35),transparent);
  border-radius:10px;
  padding:8px 10px;
  font-weight:600;
}

/* ===== TOGGLE ===== */
.sidebar-toggle{
  position:fixed;
  top:50%;
  left:0;
  transform:translateY(-50%);
  background:rgba(255,255,255,.9);
  padding:10px 6px;
  border-radius:0 10px 10px 0;
  font-weight:600;
  cursor:pointer;
  z-index:1001;
}

/* ===== EDGE SWIPE ZONE (iOS SAFE) ===== */
#edgeSwipe{
  position:fixed;
  top:0;
  left:0;
  width:24px;
  height:100vh;
  z-index:2000;
}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(4px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:999;
}
.overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:28px;
  width:100%;
  overflow:hidden;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  gap:20px;
  align-items:center;
}
.header img{
  width:150px;
  height:150px;
  border-radius:14px;
  object-fit:cover;
}
.header h1{
  margin:0;
  font-size:2.4rem;
  word-break:break-word;
}
.poetry{opacity:.6;font-style:italic}

/* ===== SONG LIST ===== */
.song-header,.song{
  display:grid;
  grid-template-columns:40px 60px 2fr 1.5fr 60px;
  padding:10px;
  align-items:center;
}
.song-header{
  margin-top:20px;
  opacity:.5;
  border-bottom:1px solid rgba(0,0,0,.1);
}
.song{
  border-radius:10px;
  cursor:pointer;
}
.song:hover{background:rgba(255,255,255,.35)}
.song img{
  width:42px;
  height:42px;
  border-radius:6px;
}
.song.playing{
  background:linear-gradient(90deg,rgba(236,72,153,.25),transparent);
  font-weight:600;
}

/* ===== SCROLL ===== */
#songs{
  height:calc(100vh - 360px);
  overflow-y:auto;
  padding-bottom:140px;
}
#songs::-webkit-scrollbar{width:0}
#songs{scrollbar-width:none}

/* ===== PLAYER ===== */
.player{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 30px);
  max-width:1100px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-radius:18px;
  padding:10px 16px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  transition:.35s;
}

.player.expanded{
  bottom:0;
  height:70vh;
  border-radius:18px 18px 0 0;
}

.player-left{
  display:flex;
  gap:12px;
  align-items:center;
}
.player-left img{
  width:48px;
  height:48px;
  border-radius:8px;
}

.controls{
  display:flex;
  gap:18px;
}
.controls button{
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
}

/* ===== PROGRESS ===== */
.progress-wrap{
  grid-column:1/-1;
  display:flex;
  gap:10px;
  align-items:center;
  font-size:.75rem;
  opacity:.7;
}
.progress{
  flex:1;
  height:4px;
  background:rgba(0,0,0,.15);
  border-radius:10px;
  cursor:pointer;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#ec4899;
  border-radius:10px;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .header{
    flex-direction:column;
    text-align:center;
  }
  .header img{
    width:130px;
    height:130px;
  }
  .header h1{
    font-size:2rem;
  }
  .song-header,.song{
    grid-template-columns:30px 50px 1fr 60px;
  }
  .song span:nth-child(4){
    display:none;
  }
}
</style>
</head>

<body>

<div id="edgeSwipe"></div>
<div class="sidebar-toggle" onclick="toggleSidebar()">》》》</div>
<div class="overlay" onclick="closeSidebar()"></div>

<div class="container">

  <div class="sidebar">
    <h3>playlists</h3>
    <div class="playlist-btn" data-key="morning" onclick="load('morning');closeSidebar()">🌅 morning feels</div>
    <div class="playlist-btn" data-key="goto" onclick="load('goto');closeSidebar()">🎧 my go to songs</div>
    <div class="playlist-btn" data-key="cry" onclick="load('cry');closeSidebar()">🖤 Cry with me</div>
    <div class="playlist-btn" data-key="emo" onclick="load('emo');closeSidebar()">🌧️ endhukoo emo</div>
  </div>

  <div class="main">
    <div class="header">
      <img id="cover" src="mrng.jpeg">
      <div>
        <p style="opacity:.6">Public Playlist</p>
        <h1 id="title">morning feels 🥰</h1>
        <div class="poetry" id="poetry">I wake up softer than yesterday</div>
      </div>
    </div>

    <div class="song-header">
      <span>#</span><span></span><span>Title</span><span>Album</span><span>⏱</span>
    </div>

    <div id="songs"></div>
  </div>
</div>

<div class="player" id="player">
  <div class="player-left">
    <img id="pimg">
    <div>
      <div id="ptitle">—</div>
      <div id="partist" style="opacity:.6;font-size:.85rem">—</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">⏯</button>
    <button onclick="next()">⏭</button>
  </div>

  <div></div>

  <div class="progress-wrap">
    <span id="cur">0:00</span>
    <div class="progress" onclick="seek(event)">
      <div class="progress-bar" id="bar"></div>
    </div>
    <span id="dur">0:00</span>
  </div>

  <audio id="audio"></audio>
</div>

<script>
/* ===== SIDEBAR ===== */
function toggleSidebar(){
  document.querySelector(".sidebar").classList.toggle("open");
  document.querySelector(".overlay").classList.toggle("show");
}
function closeSidebar(){
  document.querySelector(".sidebar").classList.remove("open");
  document.querySelector(".overlay").classList.remove("show");
}

/* ===== EDGE SWIPE (iOS SAFE) ===== */
let sx=0;
edgeSwipe.addEventListener("touchstart",e=>{
  sx=e.touches[0].clientX;
},{passive:true});
edgeSwipe.addEventListener("touchend",e=>{
  if(e.changedTouches[0].clientX - sx > 60){
    toggleSidebar();
  }
});

/* ===== PLAYER TAP EXPAND (iOS STYLE) ===== */
player.addEventListener("click",()=>{
  player.classList.toggle("expanded");
});

/* ===== DATA ===== */
const playlists={
  morning:{
    title:"morning feels 🥰",
    poetry:"I wake up softer than yesterday",
    cover:"mrng.jpeg",
    songs:[
      {
        title:"Mera Mann Kehne Laga",
        artist:"Falak Shabbir",
        album:"Nautanki Saala",
        time:"3:47",
        img:"1.jpeg",
        src:"songs/Mera Mann Kehne Laga Nautanki Saala! 320 Kbps.mp3"
      },
      {
        title:"Tum Se Hi",
        artist:"Mohit Chauhan",
        album:"Jab We Met",
        time:"5:21",
        img:"2.jpeg",
        src:"songs/Tum Se Hi Jab We Met 320 Kbps.mp3"
      }
    ]
  },
  goto:{title:"my go to songs",poetry:"these sound like me",cover:"mrng.jpeg",songs:[]},
  cry:{title:"Cry with me",poetry:"I let myself feel it",cover:"mrng.jpeg",songs:[]},
  emo:{title:"endhukoo emo",poetry:"some things don’t need answers",cover:"mrng.jpeg",songs:[]}
};

let list=[],index=0;
const audio=document.getElementById("audio");

/* ===== LOAD ===== */
function load(key){
  localStorage.setItem("lastPlaylist",key);

  document.querySelectorAll(".playlist-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.key===key);
  });

  const p=playlists[key];
  title.textContent=p.title;
  poetry.textContent=p.poetry;
  cover.src=p.cover;
  list=p.songs;
  songs.innerHTML="";
  p.songs.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="song";
    d.innerHTML=`<span>${i+1}</span><img src="${s.img}"><span>${s.title}</span><span>${s.album}</span><span>${s.time}</span>`;
    d.onclick=()=>play(i);
    songs.appendChild(d);
  });
  if(list.length) play(0);
}

/* ===== PLAYER ===== */
function play(i){
  index=i;
  const s=list[i];
  audio.src=s.src;
  audio.play();
  pimg.src=s.img;
  ptitle.textContent=s.title;
  partist.textContent=s.artist;
  document.querySelectorAll(".song").forEach((e,j)=>e.classList.toggle("playing",j===i));
}
function toggle(){audio.paused?audio.play():audio.pause()}
function prev(){play((index-1+list.length)%list.length)}
function next(){play((index+1)%list.length)}
audio.onended=next;

/* ===== PROGRESS ===== */
audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration)*100+"%";
  cur.textContent=format(audio.currentTime);
  dur.textContent=format(audio.duration);
};
function seek(e){
  audio.currentTime=(e.offsetX/e.target.offsetWidth)*audio.duration;
}
function format(t){
  if(!t) return "0:00";
  const m=Math.floor(t/60);
  const s=Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

/* ===== RESTORE ===== */
load(localStorage.getItem("lastPlaylist") || "morning");
</script>

</body>
</html>
