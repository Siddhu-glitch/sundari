<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>music for you</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:"Century Gothic","Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fde2e4,#fff1f2,#fef3c7);
  color:#374151;
}

/* ===== TRANSPARENT SIDEBAR ===== */
.sidebar{
  position:fixed;
  top:0;
  left:-220px;
  width:220px;
  height:100vh;
  padding:24px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  transition:.35s ease;
  z-index:1000;
}
.sidebar.open{left:0}

.playlist-btn{
  margin-bottom:14px;
  cursor:pointer;
  opacity:.8;
}
.playlist-btn:hover{opacity:1}

/* ===== PLAYER ===== */
.player{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:680px;
  background:rgba(255,255,255,.95);
  border-radius:22px;
  padding:14px 16px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}

/* TOP ROW */
.player-top{
  display:flex;
  align-items:center;
  gap:14px;
}

/* LEFT IMAGE ONLY */
.player-top img{
  width:56px;
  height:56px;
  border-radius:12px;
  object-fit:cover;
}

/* TITLE + ARTIST */
.song-info{
  flex:1;
  min-width:0;
}
.song-info h4{
  margin:0;
  font-size:1.1rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-info p{
  margin:2px 0 0;
  font-size:.85rem;
  opacity:.6;
}

/* CONTROLS CENTERED */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:30px;
  margin:12px 0 6px;
}
.controls button{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
}
.controls .play{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#ec4899;
  color:#fff;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(236,72,153,.45);
}

/* PROGRESS */
.progress-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:.75rem;
  opacity:.65;
}
.progress{
  flex:1;
  height:4px;
  background:rgba(0,0,0,.15);
  border-radius:10px;
  cursor:pointer;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#ec4899;
  border-radius:10px;
}

/* MOBILE TWEAK */
@media(max-width:480px){
  .controls{gap:26px}
}
</style>
</head>

<body>

<!-- PLAYER -->
<div class="player">

  <div class="player-top">
    <img id="pimg" src="2.jpeg">
    <div class="song-info">
      <h4 id="ptitle">Tum Se Hi</h4>
      <p id="partist">Mohit Chauhan</p>
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
  </div>

  <div class="progress-wrap">
    <span id="cur">0:00</span>
    <div class="progress" onclick="seek(event)">
      <div class="progress-bar" id="bar"></div>
    </div>
    <span id="dur">5:21</span>
  </div>

  <audio id="audio"></audio>
</div>

<script>
const playlist=[
  {
    title:"Tum Se Hi",
    artist:"Mohit Chauhan",
    img:"2.jpeg",
    src:"songs/Tum Se Hi Jab We Met 320 Kbps.mp3"
  }
];

const audio=document.getElementById("audio");
audio.src=playlist[0].src;

function toggle(){
  if(audio.paused){
    audio.play();
    playBtn.textContent="❚❚";
  }else{
    audio.pause();
    playBtn.textContent="▶";
  }
}

audio.onloadedmetadata=()=>dur.textContent=format(audio.duration);
audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration)*100+"%";
  cur.textContent=format(audio.currentTime);
};

function seek(e){
  audio.currentTime=(e.offsetX/e.target.offsetWidth)*audio.duration;
}

function format(t){
  const m=Math.floor(t/60);
  const s=Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
</script>

</body>
</html>
